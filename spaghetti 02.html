<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydration Reminder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #b3e5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 150, 200, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #0288d1;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .subtitle {
            color: #757575;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .water-display {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            background-color: #e1f5fe;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        .water-level {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #4fc3f7, #29b6f6);
            transition: height 1s ease;
            border-radius: 0 0 100px 100px;
        }
        
        .water-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            color: #01579b;
            z-index: 1;
        }
        
        .goal-display {
            margin: 20px 0;
            font-size: 1.2rem;
            color: #0288d1;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin: 25px 0;
        }
        
        button {
            background-color: #0288d1;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(2, 136, 209, 0.3);
        }
        
        button:hover {
            background-color: #0277bd;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(2, 136, 209, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .reminder-settings {
            background-color: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }
        
        .reminder-settings h3 {
            color: #0288d1;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .setting-row label {
            color: #424242;
            font-weight: 500;
        }
        
        input[type="number"], input[type="time"] {
            width: 100px;
            padding: 8px 12px;
            border: 1px solid #bdbdbd;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #0288d1;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .history {
            margin-top: 25px;
            text-align: left;
        }
        
        .history h3 {
            color: #0288d1;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 10px;
        }
        
        .history-item {
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
            color: #424242;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0288d1;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 100;
        }
        
        @media (max-width: 500px) {
            .container {
                padding: 20px 15px;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stay Hydrated</h1>
        <p class="subtitle">Track your water intake and stay healthy</p>
        
        <div class="water-display">
            <div class="water-level" id="waterLevel"></div>
            <div class="water-percentage" id="waterPercentage">0%</div>
        </div>
        
        <div class="goal-display" id="goalDisplay">
            Goal: 0 / 2000 ml
        </div>
        
        <div class="controls">
            <button id="addSmall">+ 250ml</button>
            <button id="addMedium">+ 500ml</button>
            <button id="addLarge">+ 1000ml</button>
        </div>
        
        <div class="reminder-settings">
            <h3>Reminder Settings</h3>
            <div class="setting-row">
                <label for="reminderToggle">Enable Reminders</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="reminderToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <label for="reminderInterval">Interval (minutes)</label>
                <input type="number" id="reminderInterval" min="15" max="180" value="60">
            </div>
            <div class="setting-row">
                <label for="dailyGoal">Daily Goal (ml)</label>
                <input type="number" id="dailyGoal" min="500" max="5000" value="2000">
            </div>
        </div>
        
        <div class="history">
            <h3>Today's Intake</h3>
            <div class="history-list" id="historyList">
                <!-- History items will be added here -->
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">
        Time to drink water! 💧
    </div>

    <script>
        // DOM Elements
        const waterLevel = document.getElementById('waterLevel');
        const waterPercentage = document.getElementById('waterPercentage');
        const goalDisplay = document.getElementById('goalDisplay');
        const historyList = document.getElementById('historyList');
        const notification = document.getElementById('notification');
        
        // Buttons
        const addSmallBtn = document.getElementById('addSmall');
        const addMediumBtn = document.getElementById('addMedium');
        const addLargeBtn = document.getElementById('addLarge');
        
        // Settings
        const reminderToggle = document.getElementById('reminderToggle');
        const reminderInterval = document.getElementById('reminderInterval');
        const dailyGoal = document.getElementById('dailyGoal');
        
        // State
        let currentIntake = 0;
        let goal = 2000;
        let reminderTimer = null;
        
        // Initialize the app
        function init() {
            // Load saved data from localStorage
            const savedIntake = localStorage.getItem('hydrationIntake');
            const savedGoal = localStorage.getItem('hydrationGoal');
            const savedReminderEnabled = localStorage.getItem('reminderEnabled');
            const savedReminderInterval = localStorage.getItem('reminderInterval');
            
            if (savedIntake) {
                currentIntake = parseInt(savedIntake);
            }
            
            if (savedGoal) {
                goal = parseInt(savedGoal);
                dailyGoal.value = goal;
            }
            
            if (savedReminderEnabled) {
                reminderToggle.checked = savedReminderEnabled === 'true';
            }
            
            if (savedReminderInterval) {
                reminderInterval.value = savedReminderInterval;
            }
            
            // Load history
            loadHistory();
            
            // Update display
            updateDisplay();
            
            // Set up reminders if enabled
            if (reminderToggle.checked) {
                startReminders();
            }
            
            // Set up event listeners
            setupEventListeners();
        }
        
        // Set up event listeners
        function setupEventListeners() {
            addSmallBtn.addEventListener('click', () => addWater(250));
            addMediumBtn.addEventListener('click', () => addWater(500));
            addLargeBtn.addEventListener('click', () => addWater(1000));
            
            reminderToggle.addEventListener('change', toggleReminders);
            reminderInterval.addEventListener('change', updateReminderInterval);
            dailyGoal.addEventListener('change', updateDailyGoal);
        }
        
        // Add water to intake
        function addWater(amount) {
            currentIntake += amount;
            updateDisplay();
            saveData();
            addToHistory(amount);
            
            // Show success message
            showNotification(`Added ${amount}ml of water!`);
        }
        
        // Update the water display
        function updateDisplay() {
            const percentage = Math.min((currentIntake / goal) * 100, 100);
            waterLevel.style.height = `${percentage}%`;
            waterPercentage.textContent = `${Math.round(percentage)}%`;
            goalDisplay.textContent = `Goal: ${currentIntake} / ${goal} ml`;
            
            // Change color based on progress
            if (percentage >= 100) {
                waterLevel.style.background = 'linear-gradient(to top, #4caf50, #66bb6a)';
                showNotification('Congratulations! You reached your daily goal! 🎉');
            } else if (percentage >= 75) {
                waterLevel.style.background = 'linear-gradient(to top, #29b6f6, #4fc3f7)';
            } else if (percentage >= 50) {
                waterLevel.style.background = 'linear-gradient(to top, #0288d1, #29b6f6)';
            } else {
                waterLevel.style.background = 'linear-gradient(to top, #01579b, #0288d1)';
            }
        }
        
        // Add entry to history
        function addToHistory(amount) {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.textContent = `${timeString} - ${amount}ml`;
            
            historyList.prepend(historyItem);
            
            // Save history to localStorage
            saveHistory();
        }
        
        // Load history from localStorage
        function loadHistory() {
            const savedHistory = localStorage.getItem('hydrationHistory');
            if (savedHistory) {
                const history = JSON.parse(savedHistory);
                history.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    historyItem.textContent = item;
                    historyList.appendChild(historyItem);
                });
            }
        }
        
        // Save history to localStorage
        function saveHistory() {
            const historyItems = Array.from(historyList.children).map(item => item.textContent);
            localStorage.setItem('hydrationHistory', JSON.stringify(historyItems));
        }
        
        // Toggle reminders on/off
        function toggleReminders() {
            if (reminderToggle.checked) {
                startReminders();
            } else {
                stopReminders();
            }
            saveData();
        }
        
        // Start reminder interval
        function startReminders() {
            stopReminders(); // Clear any existing timer
            const interval = parseInt(reminderInterval.value) * 60 * 1000; // Convert to milliseconds
            reminderTimer = setInterval(() => {
                showNotification("Time to drink water! 💧");
            }, interval);
        }
        
        // Stop reminder interval
        function stopReminders() {
            if (reminderTimer) {
                clearInterval(reminderTimer);
                reminderTimer = null;
            }
        }
        
        // Update reminder interval
        function updateReminderInterval() {
            if (reminderToggle.checked) {
                startReminders();
            }
            saveData();
        }
        
        // Update daily goal
        function updateDailyGoal() {
            goal = parseInt(dailyGoal.value);
            updateDisplay();
            saveData();
        }
        
        // Show notification
        function showNotification(message) {
            notification.textContent = message;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
        }
        
        // Save data to localStorage
        function saveData() {
            localStorage.setItem('hydrationIntake', currentIntake.toString());
            localStorage.setItem('hydrationGoal', goal.toString());
            localStorage.setItem('reminderEnabled', reminderToggle.checked.toString());
            localStorage.setItem('reminderInterval', reminderInterval.value);
        }
        
        // Initialize the app when the page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
