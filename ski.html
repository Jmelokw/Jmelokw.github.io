<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birds Eye Ski - Top Down Ski Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }
        
        #gameContainer {
            position: relative;
            text-align: center;
        }
        
        canvas {
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            background: #2e7d32;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            text-align: left;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        
        #score {
            font-size: 28px;
            margin-bottom: 5px;
            color: #ffeb3b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        
        #speed {
            font-size: 18px;
            color: #4fc3f7;
            margin-bottom: 5px;
        }
        
        #lives {
            font-size: 18px;
            color: #ff5252;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            font-size: 14px;
            text-align: left;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 3px solid #ffeb3b;
            min-width: 300px;
        }
        
        #gameOver h1 {
            color: #ff5252;
            margin-top: 0;
            font-size: 36px;
        }
        
        #finalScore {
            font-size: 24px;
            color: #4fc3f7;
            margin: 20px 0;
        }
        
        #restartBtn {
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(to right, #ff4081, #f50057);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #restartBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255,64,129,0.4);
        }
        
        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            color: #ffeb3b;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        .key {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 5px;
            margin: 0 5px;
            font-family: monospace;
        }
        
        .boost {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            z-index: 10;
            color: #00e676;
            font-size: 16px;
        }
        
        #boostBar {
            width: 100px;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        #boostFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #00e676, #00c853);
            border-radius: 5px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="title">⛷️ BIRDS EYE SKI - TOP DOWN DESCENT ⛷️</div>
        
        <div id="hud">
            <div id="score">SCORE: 0</div>
            <div id="speed">SPEED: 0 MPH</div>
            <div id="lives">❤️❤️❤️</div>
        </div>
        
        <div class="boost">
            <div>BOOST: <span id="boostText">READY</span></div>
            <div id="boostBar">
                <div id="boostFill"></div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="controls">
            <div><span class="key">W/A/S/D</span> or <span class="key">ARROWS</span> to ski</div>
            <div><span class="key">SPACE</span> for boost</div>
            <div>Collect flags, avoid trees & rocks!</div>
        </div>
        
        <div id="gameOver">
            <h1>FINISH LINE! 🏁</h1>
            <div id="finalScore">SCORE: 0</div>
            <div id="distance">DISTANCE: 0m</div>
            <button id="restartBtn">SKI AGAIN!</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const speedElement = document.getElementById('speed');
        const livesElement = document.getElementById('lives');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const distanceElement = document.getElementById('distance');
        const restartBtn = document.getElementById('restartBtn');
        const boostText = document.getElementById('boostText');
        const boostFill = document.getElementById('boostFill');

        // Game state
        let score = 0;
        let lives = 3;
        let gameSpeed = 3;
        let playerSpeed = 0;
        let maxPlayerSpeed = 15;
        let acceleration = 0.1;
        let friction = 0.03;
        let isGameOver = false;
        let distance = 0;
        let boostMeter = 100;
        let isBoosting = false;
        let boostCooldown = false;
        let frames = 0;

        // Player (skier) - positioned at bottom center, looking up
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 30,
            height: 50,
            angle: 0,
            turnSpeed: 0.05,
            color: '#FF4081',
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Skier body
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                
                // Skier head
                ctx.fillStyle = '#FFCCBC';
                ctx.beginPath();
                ctx.arc(0, -this.height/2 - 10, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // Goggles
                ctx.fillStyle = '#1565C0';
                ctx.fillRect(-10, -this.height/2 - 5, 20, 8);
                
                // Skis
                ctx.fillStyle = '#FF9800';
                ctx.fillRect(-25, this.height/2 - 5, 50, 8);
                
                // Ski poles
                ctx.strokeStyle = '#795548';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-20, 0);
                ctx.lineTo(-40, 20);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(20, 0);
                ctx.lineTo(40, 20);
                ctx.stroke();
                
                // Boost effect
                if (isBoosting) {
                    ctx.fillStyle = '#FFEB3B';
                    ctx.beginPath();
                    ctx.arc(0, this.height/2 + 10, 15, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FF9800';
                    ctx.beginPath();
                    ctx.arc(0, this.height/2 + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            },
            
            update() {
                // Apply friction
                playerSpeed *= (1 - friction);
                
                // Gravity effect (always moving downward slightly)
                this.y += gameSpeed * 0.5;
                
                // Move based on angle and speed
                this.x += Math.sin(this.angle) * playerSpeed;
                this.y -= Math.cos(this.angle) * playerSpeed;
                
                // Keep player on screen
                this.x = Math.max(this.width/2, Math.min(canvas.width - this.width/2, this.x));
                this.y = Math.max(this.height/2, Math.min(canvas.height - this.height/2, this.y));
                
                // Update speed display
                speedElement.textContent = `SPEED: ${Math.round(playerSpeed * 10)} MPH`;
                
                // Update distance
                distance += playerSpeed * 0.1;
            },
            
            turnLeft() {
                this.angle -= this.turnSpeed;
            },
            
            turnRight() {
                this.angle += this.turnSpeed;
            },
            
            accelerate() {
                if (playerSpeed < maxPlayerSpeed) {
                    playerSpeed += acceleration;
                }
            },
            
            brake() {
                if (playerSpeed > 0) {
                    playerSpeed -= acceleration * 2;
                }
            },
            
            boost() {
                if (boostMeter >= 20 && !boostCooldown) {
                    isBoosting = true;
                    playerSpeed = Math.min(playerSpeed + 5, maxPlayerSpeed * 1.5);
                    boostMeter -= 20;
                    
                    setTimeout(() => {
                        isBoosting = false;
                    }, 300);
                    
                    // Start recharge after 2 seconds
                    if (!boostCooldown) {
                        boostCooldown = true;
                        setTimeout(() => {
                            boostCooldown = false;
                        }, 2000);
                    }
                }
            },
            
            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.angle = 0;
                playerSpeed = 3;
            }
        };

        // Terrain generation
        const terrain = {
            tiles: [],
            tileSize: 100,
            
            generate() {
                this.tiles = [];
                for (let y = -this.tileSize; y < canvas.height + this.tileSize; y += this.tileSize) {
                    for (let x = -this.tileSize; x < canvas.width + this.tileSize; x += this.tileSize) {
                        // Create mountain slope effect (darker at top)
                        const depth = y / canvas.height;
                        const green = Math.floor(100 + depth * 155);
                        const color = `rgb(40, ${green}, 40)`;
                        
                        this.tiles.push({
                            x: x + Math.sin(y * 0.01) * 30, // Wavy pattern
                            y: y,
                            color: color,
                            trees: Math.random() > 0.7
                        });
                    }
                }
            },
            
            draw() {
                // Draw slope lines for 3D effect
                for (let i = 0; i < 20; i++) {
                    const y = canvas.height - i * 30;
                    const width = 200 + i * 40;
                    
                    ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + i * 0.03})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width/2 - width/2, y);
                    ctx.lineTo(canvas.width/2 + width/2, y);
                    ctx.stroke();
                }
                
                // Draw tiles
                this.tiles.forEach(tile => {
                    ctx.fillStyle = tile.color;
                    ctx.fillRect(tile.x, tile.y, this.tileSize, this.tileSize);
                    
                    // Draw grid lines
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(tile.x, tile.y, this.tileSize, this.tileSize);
                    
                    // Draw some trees on tiles marked with trees
                    if (tile.trees && Math.random() > 0.5) {
                        const treeX = tile.x + Math.random() * this.tileSize;
                        const treeY = tile.y + Math.random() * this.tileSize;
                        
                        // Tree trunk
                        ctx.fillStyle = '#5D4037';
                        ctx.fillRect(treeX - 3, treeY - 15, 6, 15);
                        
                        // Tree top
                        ctx.fillStyle = '#388E3C';
                        ctx.beginPath();
                        ctx.arc(treeX, treeY - 20, 12, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                
                // Draw finish line at top
                ctx.fillStyle = '#FFEB3B';
                for (let i = 0; i < 10; i++) {
                    const x = i * 80;
                    ctx.fillRect(x, 50, 40, 10);
                    ctx.fillStyle = i % 2 === 0 ? '#FFEB3B' : '#1a237e';
                }
                ctx.fillStyle = '#FFEB3B';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🏁 FINISH LINE 🏁', canvas.width/2, 40);
            },
            
            update() {
                // Move terrain downward to create skiing effect
                this.tiles.forEach(tile => {
                    tile.y += gameSpeed + playerSpeed * 0.5;
                    
                    // Wrap around
                    if (tile.y > canvas.height + this.tileSize) {
                        tile.y = -this.tileSize;
                        tile.x = Math.random() * canvas.width;
                        tile.trees = Math.random() > 0.7;
                    }
                });
            }
        };

        // Obstacles (trees, rocks)
        const obstacles = [];
        class Obstacle {
            constructor(type) {
                this.type = type || (Math.random() > 0.5 ? 'tree' : 'rock');
                this.size = 30 + Math.random() * 20;
                this.x = Math.random() * canvas.width;
                this.y = -this.size;
                this.speed = gameSpeed + Math.random() * 2;
                
                if (this.type === 'tree') {
                    this.color = '#388E3C';
                    this.trunkColor = '#5D4037';
                } else {
                    this.color = '#78909C';
                }
            }
            
            draw() {
                if (this.type === 'tree') {
                    // Tree trunk
                    ctx.fillStyle = this.trunkColor;
                    ctx.fillRect(this.x - 5, this.y - this.size/2, 10, this.size/2);
                    
                    // Tree top
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - this.size/2, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Snow on tree
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - this.size/2 - 5, this.size/4, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Rock
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Rock highlights
                    ctx.fillStyle = '#B0BEC5';
                    ctx.beginPath();
                    ctx.arc(this.x - this.size/4, this.y - this.size/4, this.size/6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            update() {
                this.y += this.speed + playerSpeed * 0.3;
            }
            
            collides() {
                const dx = this.x - player.x;
                const dy = this.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < (this.size/2 + Math.min(player.width, player.height)/2);
            }
        }

        // Collectibles (flags, coins, boost)
        const collectibles = [];
        class Collectible {
            constructor(type) {
                this.type = type || ['flag', 'coin', 'boost'][Math.floor(Math.random() * 3)];
                this.size = 25;
                this.x = Math.random() * canvas.width;
                this.y = -this.size;
                this.speed = gameSpeed;
                this.rotation = 0;
                
                switch(this.type) {
                    case 'flag':
                        this.color = '#FF5252';
                        this.value = 50;
                        break;
                    case 'coin':
                        this.color = '#FFEB3B';
                        this.value = 25;
                        break;
                    case 'boost':
                        this.color = '#00E676';
                        this.value = 0;
                        break;
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                this.rotation += 0.05;
                ctx.rotate(this.rotation);
                
                if (this.type === 'flag') {
                    // Flag pole
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(-2, -this.size, 4, this.size);
                    
                    // Flag
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size);
                    ctx.lineTo(this.size/2, -this.size + this.size/3);
                    ctx.lineTo(0, -this.size + this.size*2/3);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'coin') {
                    // Coin
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FF9800';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size/3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('$', 0, 0);
                } else if (this.type === 'boost') {
                    // Boost item
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚡', 0, 0);
                }
                
                ctx.restore();
            }
            
            update() {
                this.y += this.speed + playerSpeed * 0.2;
            }
            
            collect() {
                const dx = this.x - player.x;
                const dy = this.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < (this.size/2 + Math.min(player.width, player.height)/2)) {
                    if (this.type === 'boost') {
                        boostMeter = Math.min(100, boostMeter + 30);
                    } else {
                        score += this.value;
                        scoreElement.textContent = `SCORE: ${score}`;
                    }
                    return true;
                }
                return false;
            }
        }

        // Generate objects
        function generateObjects() {
            if (frames % 60 === 0) { // New obstacle every second
                obstacles.push(new Obstacle());
            }
            
            if (frames % 45 === 0) { // New collectible every 0.75 seconds
                collectibles.push(new Collectible());
            }
        }

        // Update boost meter
        function updateBoost() {
            // Recharge boost
            if (boostMeter < 100 && !isBoosting) {
                boostMeter += 0.3;
            }
            
            // Update UI
            boostFill.style.width = `${boostMeter}%`;
            
            if (boostMeter < 20) {
                boostText.textContent = 'EMPTY';
                boostText.style.color = '#ff5252';
            } else if (boostMeter < 50) {
                boostText.textContent = 'LOW';
                boostText.style.color = '#ff9800';
            } else if (boostCooldown) {
                boostText.textContent = 'COOLDOWN';
                boostText.style.color = '#b0b0b0';
            } else {
                boostText.textContent = 'READY';
                boostText.style.color = '#00e676';
            }
        }

        // Update lives display
        function updateLives() {
            let hearts = '';
            for (let i = 0; i < lives; i++) {
                hearts += '❤️';
            }
            livesElement.textContent = hearts;
        }

        // Check for finish line
        function checkFinishLine() {
            if (player.y < 100 && !isGameOver) {
                isGameOver = true;
                finalScoreElement.textContent = `SCORE: ${score}`;
                distanceElement.textContent = `DISTANCE: ${Math.round(distance)}m`;
                gameOverElement.style.display = 'block';
                
                // Bonus for reaching finish line
                score += Math.round(distance);
                finalScoreElement.textContent = `SCORE: ${score}`;
            }
        }

        // Game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!isGameOver) {
                // Update terrain
                terrain.update();
                terrain.draw();
                
                // Generate objects
                generateObjects();
                
                // Update and draw obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].update();
                    obstacles[i].draw();
                    
                    // Remove off-screen obstacles
                    if (obstacles[i].y > canvas.height + obstacles[i].size) {
                        obstacles.splice(i, 1);
                        continue;
                    }
                    
                    // Check collision
                    if (obstacles[i].collides()) {
                        obstacles.splice(i, 1);
                        lives--;
                        updateLives();
                        playerSpeed *= 0.5;
                        
                        // Game over
                        if (lives <= 0) {
                            isGameOver = true;
                            finalScoreElement.textContent = `SCORE: ${score}`;
                            distanceElement.textContent = `DISTANCE: ${Math.round(distance)}m`;
                            gameOverElement.style.display = 'block';
                        }
                    }
                }
                
                // Update and draw collectibles
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    collectibles[i].update();
                    collectibles[i].draw();
                    
                    // Remove off-screen collectibles
                    if (collectibles[i].y > canvas.height + collectibles[i].size) {
                        collectibles.splice(i, 1);
                        continue;
                    }
                    
                    // Check collection
                    if (collectibles[i].collect()) {
                        collectibles.splice(i, 1);
                    }
                }
                
                // Update player
                player.update();
                player.draw();
                
                // Update boost
                updateBoost();
                
                // Check finish line
                checkFinishLine();
                
                frames++;
            }
            
            requestAnimationFrame(gameLoop);
        }

        // Controls
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === ' ' || e.key === 'Spacebar') {
                player.boost();
            }
            
            if (isGameOver && e.key === 'Enter') {
                restartGame();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Handle continuous key presses
        function handleControls() {
            if (keys['w'] || keys['arrowup']) {
                player.accelerate();
            }
            if (keys['s'] || keys['arrowdown']) {
                player.brake();
            }
            if (keys['a'] || keys['arrowleft']) {
                player.turnLeft();
            }
            if (keys['d'] || keys['arrowright']) {
                player.turnRight();
            }
        }

        // Control handler loop
        setInterval(handleControls, 16);

        // Restart game
        function restartGame() {
            score = 0;
            lives = 3;
            gameSpeed = 3;
            playerSpeed = 3;
            isGameOver = false;
            distance = 0;
            boostMeter = 100;
            frames = 0;
            
            obstacles.length = 0;
            collectibles.length = 0;
            
            scoreElement.textContent = `SCORE: ${score}`;
            updateLives();
            gameOverElement.style.display = 'none';
            
            player.reset();
            terrain.generate();
        }

        restartBtn.addEventListener('click', restartGame);

        // Initialize game
        terrain.generate();
        gameLoop();
        
        // Add some initial obstacles and collectibles
        setTimeout(() => {
            for (let i = 0; i < 5; i++) {
                obstacles.push(new Obstacle());
            }
            for (let i = 0; i < 3; i++) {
                collectibles.push(new Collectible());
            }
        }, 1000);
    </script>
</body>
</html>
