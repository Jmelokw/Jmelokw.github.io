<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .button-shadow {
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }
            .button-shadow-hover {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-inter">
    <div class="container mx-auto px-4 py-16 max-w-2xl">
        <div class="bg-white rounded-xl shadow-lg p-8 transform transition-all duration-300 hover:shadow-xl">
            <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-gray-800 mb-6 text-center">按钮点击示例</h1>
            
            <div class="flex flex-col items-center justify-center space-y-8">
                <!-- 基本按钮 -->
                <div class="w-full">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">基本按钮</h2>
                    <div class="flex flex-wrap gap-4">
                        <button id="basicButton" class="px-6 py-3 bg-primary text-white rounded-lg transition-all duration-300 hover:bg-primary/90 transform hover:-translate-y-1 button-shadow hover:button-shadow-hover">
                            点击我
                        </button>
                        <button class="px-6 py-3 bg-gray-200 text-gray-800 rounded-lg transition-all duration-300 hover:bg-gray-300 transform hover:-translate-y-1 button-shadow hover:button-shadow-hover">
                            禁用状态
                        </button>
                    </div>
                </div>
                
                <!-- 图标按钮 -->
                <div class="w-full">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">图标按钮</h2>
                    <div class="flex flex-wrap gap-4">
                        <button class="px-6 py-3 bg-secondary text-white rounded-lg transition-all duration-300 hover:bg-secondary/90 transform hover:-translate-y-1 button-shadow hover:button-shadow-hover flex items-center">
                            <i class="fa fa-check mr-2"></i> 确认
                        </button>
                        <button class="px-6 py-3 bg-red-500 text-white rounded-lg transition-all duration-300 hover:bg-red-600 transform hover:-translate-y-1 button-shadow hover:button-shadow-hover flex items-center">
                            <i class="fa fa-trash mr-2"></i> 删除
                        </button>
                    </div>
                </div>
                
                <!-- 不同大小按钮 -->
                <div class="w-full">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">不同大小按钮</h2>
                    <div class="flex flex-wrap gap-4">
                        <button class="px-4 py-2 bg-primary text-white rounded-lg transition-all duration-300 hover:bg-primary/90 transform hover:-translate-y-1 button-shadow hover:button-shadow-hover text-sm">
                            小按钮
                        </button>
                        <button class="px-6 py-3 bg-primary text-white rounded-lg transition-all duration-300 hover:bg-primary/90 transform hover:-translate-y-1 button-shadow hover:button-shadow-hover">
                            标准按钮
                        </button>
                        <button class="px-8 py-4 bg-primary text-white rounded-lg transition-all duration-300 hover:bg-primary/90 transform hover:-translate-y-1 button-shadow hover:button-shadow-hover text-lg">
                            大按钮
                        </button>
                    </div>
                </div>
                
                <!-- 响应区域 -->
                <div class="w-full mt-8 bg-gray-50 rounded-lg p-6 border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">响应区域</h2>
                    <div id="response" class="text-gray-600 min-h-[60px] flex items-center justify-center">
                        点击上方按钮查看效果
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 按钮点击事件处理
        document.getElementById('basicButton').addEventListener('click', function() {
            const responseDiv = document.getElementById('response');
            responseDiv.innerHTML = '<i class="fa fa-check-circle text-green-500 mr-2"></i> 按钮已被点击！';
            responseDiv.classList.add('text-green-600');
            
            // 添加动画效果
            responseDiv.classList.add('animate-pulse');
            setTimeout(() => {
                responseDiv.classList.remove('animate-pulse');
            }, 1000);
            
            // 3秒后恢复原始状态
            setTimeout(() => {
                responseDiv.innerHTML = '点击上方按钮查看效果';
                responseDiv.classList.remove('text-green-600');
            }, 3000);
        });
    </script>
</body>
</html>
