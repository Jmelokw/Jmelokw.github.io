<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet Game</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .game-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
            text-align: center;
        }
        
        .pet-container {
            margin: 20px 0;
            height: 150px;
            position: relative;
        }
        
        .pet {
            font-size: 80px;
            transition: transform 0.3s;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-value {
            font-weight: bold;
            margin-top: 5px;
        }
        
        .stat-bar {
            width: 60px;
            height: 10px;
            background-color: #eee;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .stat-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.3s;
        }
        
        .hunger-fill {
            background-color: #ff4757;
        }
        
        .happiness-fill {
            background-color: #2ed573;
        }
        
        .energy-fill {
            background-color: #1e90ff;
        }
        
        .buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            border-radius: 50px;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        #feed {
            background-color: #ff4757;
        }
        
        #play {
            background-color: #2ed573;
        }
        
        #sleep {
            background-color: #1e90ff;
        }
        
        .message {
            margin-top: 15px;
            font-style: italic;
            color: #555;
            height: 20px;
        }
        
        .pet-status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Virtual Pet</h1>
        
        <div class="pet-container">
            <div class="pet">🐶</div>
            <div class="pet-status" id="pet-status">Happy!</div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div>Hunger</div>
                <div class="stat-bar">
                    <div class="stat-fill hunger-fill" id="hunger-bar" style="width: 100%;"></div>
                </div>
                <div class="stat-value" id="hunger-value">100%</div>
            </div>
            
            <div class="stat">
                <div>Happiness</div>
                <div class="stat-bar">
                    <div class="stat-fill happiness-fill" id="happiness-bar" style="width: 100%;"></div>
                </div>
                <div class="stat-value" id="happiness-value">100%</div>
            </div>
            
            <div class="stat">
                <div>Energy</div>
                <div class="stat-bar">
                    <div class="stat-fill energy-fill" id="energy-bar" style="width: 100%;"></div>
                </div>
                <div class="stat-value" id="energy-value">100%</div>
            </div>
        </div>
        
        <div class="buttons">
            <button id="feed">Feed</button>
            <button id="play">Play</button>
            <button id="sleep">Sleep</button>
        </div>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        // Game state
        const pet = {
            hunger: 100,
            happiness: 100,
            energy: 100,
            isSleeping: false
        };

        // DOM elements
        const hungerBar = document.getElementById('hunger-bar');
        const happinessBar = document.getElementById('happiness-bar');
        const energyBar = document.getElementById('energy-bar');
        const hungerValue = document.getElementById('hunger-value');
        const happinessValue = document.getElementById('happiness-value');
        const energyValue = document.getElementById('energy-value');
        const messageEl = document.getElementById('message');
        const petEl = document.querySelector('.pet');
        const petStatus = document.getElementById('pet-status');
        
        // Buttons
        const feedBtn = document.getElementById('feed');
        const playBtn = document.getElementById('play');
        const sleepBtn = document.getElementById('sleep');

        // Update the UI based on pet state
        function updateUI() {
            // Update bars and values
            hungerBar.style.width = `${pet.hunger}%`;
            happinessBar.style.width = `${pet.happiness}%`;
            energyBar.style.width = `${pet.energy}%`;
            
            hungerValue.textContent = `${Math.round(pet.hunger)}%`;
            happinessValue.textContent = `${Math.round(pet.happiness)}%`;
            energyValue.textContent = `${Math.round(pet.energy)}%`;
            
            // Change pet appearance based on status
            if (pet.isSleeping) {
                petEl.textContent = '😴';
                petStatus.textContent = 'Sleeping...';
            } else if (pet.hunger < 30) {
                petEl.textContent = '😩';
                petStatus.textContent = 'Hungry!';
            } else if (pet.happiness < 30) {
                petEl.textContent = '😞';
                petStatus.textContent = 'Sad!';
            } else if (pet.energy < 30) {
                petEl.textContent = '😴';
                petStatus.textContent = 'Tired!';
            } else {
                petEl.textContent = '🐶';
                petStatus.textContent = 'Happy!';
            }
            
            // Color changes for low stats
            hungerBar.style.backgroundColor = pet.hunger < 30 ? '#ff4757' : '#ffa502';
            happinessBar.style.backgroundColor = pet.happiness < 30 ? '#ff4757' : '#2ed573';
            energyBar.style.backgroundColor = pet.energy < 30 ? '#ff4757' : '#1e90ff';
        }

        // Show a message that fades out
        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.style.opacity = 1;
            
            setTimeout(() => {
                messageEl.style.opacity = 0;
            }, 2000);
        }

        // Game loop - stats decrease over time
        function gameLoop() {
            if (!pet.isSleeping) {
                pet.hunger = Math.max(0, pet.hunger - 1);
                pet.happiness = Math.max(0, pet.happiness - 0.5);
                pet.energy = Math.max(0, pet.energy - 0.8);
            } else {
                // Sleeping restores energy but increases hunger
                pet.energy = Math.min(100, pet.energy + 2);
                pet.hunger = Math.max(0, pet.hunger - 0.5);
            }
            
            updateUI();
        }

        // Button actions
        feedBtn.addEventListener('click', () => {
            if (pet.isSleeping) {
                showMessage("Can't feed while sleeping!");
                return;
            }
            
            pet.hunger = Math.min(100, pet.hunger + 30);
            pet.energy = Math.max(0, pet.energy - 5);
            showMessage("Yum! That was tasty!");
            updateUI();
        });

        playBtn.addEventListener('click', () => {
            if (pet.isSleeping) {
                showMessage("Can't play while sleeping!");
                return;
            }
            
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 10);
            pet.energy = Math.max(0, pet.energy - 15);
            showMessage("Wheee! That was fun!");
            updateUI();
        });

        sleepBtn.addEventListener('click', () => {
            pet.isSleeping = !pet.isSleeping;
            
            if (pet.isSleeping) {
                showMessage("Goodnight! Zzzzz...");
                sleepBtn.textContent = "Wake Up";
            } else {
                showMessage("Good morning!");
                sleepBtn.textContent = "Sleep";
            }
            
            updateUI();
        });

        // Initialize the game
        updateUI();
        setInterval(gameLoop, 2000); // Update stats every 2 seconds
    </script>
</body>
</html>
