/* Dropdown Button */
.dropbtn {
  background-color: #04AA6D;
  color: white;
  padding: 16px;
  font-size: 16px;
  border: none;
  cursor: pointer;
  width: 200px;
  text-overflow: wrap;
}

/* Dropdown button on hover & focus */
.dropbtn:hover, .dropbtn:focus {
  background-color: #3e8e41;
}

/* The search field */
#myInput {
  box-sizing: border-box;
  background-image: url('searchicon.png');
  background-position: 14px 12px;
  background-repeat: no-repeat;
  font-size: 16px;
  padding: 14px 20px 12px 15px;
  border: none;
  border-bottom: 1px solid #ddd;
  width: 200px;
}

/* The search field when it gets focus/clicked on */
#myInput:focus {outline: 3px solid #ddd;}

/* The container <div> - needed to position the dropdown content */
.dropdown {
  position: absolute;
  display: inline-block;
  right: 50px;
}

/* Dropdown Content (Hidden by Default) */
.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f6f6f6;
  width: 200px;
  border: 1px solid #ddd;
  z-index: 1;
  text-overflow: wrap;
  max-height: 390px; /* Adjust height to fit ~10 items */
  overflow-y: auto;  /* Enables vertical scrolling */
  overflow-x: hidden;
}

/* Links inside the dropdown */
.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

/* Change color of dropdown links on hover */
.dropdown-content a:hover {background-color: #f1f1f1}

/* Show the dropdown menu (use JS to add this class to the .dropdown-content container when the user clicks on the dropdown button) */
.show {display:block;}

.buttonmusic{
   position: absolute;
   right: 50px;
   bottom: 30px;
}

        /* When the user clicks on the button,
toggle between hiding and showing the dropdown content */
function myFunction() {
  document.getElementById("myDropdown").classList.toggle("show");
}

function filterFunction() {
  var input, filter, ul, li, a, i;
  input = document.getElementById("myInput");
  filter = input.value.toUpperCase();
  div = document.getElementById("myDropdown");
  a = div.getElementsByTagName("a");
  for (i = 0; i < a.length; i++) {
    txtValue = a[i].textContent || a[i].innerText;
    if (txtValue.toUpperCase().indexOf(filter) > -1) {
      a[i].style.display = "";
    } else {
      a[i].style.display = "none";
    }
  }
}

function buyAnimal(animalName) {
  alert("You have purchased: " + animalName);

  // Show the animal
  const animalElement = document.getElementById(animalName.toLowerCase());
  if (animalElement) {
    animalElement.style.display = 'block';
  }

  // Remove the dropdown link
  const dropdownLinks = document.querySelectorAll("#myDropdown a");
  dropdownLinks.forEach(link => {
    if (link.getAttribute("data-animal").toLowerCase() === animalName.toLowerCase()) {
      link.remove();
    }
  });
}


document.addEventListener("DOMContentLoaded", function () {
  const links = document.querySelectorAll("#myDropdown a");
  links.forEach(link => {
    link.addEventListener("click", function (e) {
      e.preventDefault(); // Prevent default anchor behavior
      const animal = this.getAttribute("data-animal");
      buyAnimal(animal);
    });
  });
});
  </script>
