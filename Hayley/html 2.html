<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Wordle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        correct: '#538D4E',
                        present: '#B59F3B',
                        absent: '#3A3A3C',
                        keyboard: '#818384',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .tile-flip {
                animation: flip 0.5s ease forwards;
            }
            .keyboard-press {
                animation: press 0.1s ease forwards;
            }
            .shake {
                animation: shake 0.5s ease;
            }
            .bounce {
                animation: bounce 0.5s ease;
            }
            @keyframes flip {
                0% { transform: rotateX(0deg); }
                50% { transform: rotateX(90deg); }
                100% { transform: rotateX(0deg); }
            }
            @keyframes press {
                0% { transform: scale(1); }
                50% { transform: scale(0.9); }
                100% { transform: scale(1); }
            }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20%, 60% { transform: translateX(-5px); }
                40%, 80% { transform: translateX(5px); }
            }
            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-10px); }
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-inter min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <header class="border-b border-gray-700 py-4 px-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-tight">Endless Wordle</h1>
        <button id="newGameBtn" class="bg-primary hover:bg-primary/90 text-white py-2 px-4 rounded transition-all duration-300">
            <i class="fa fa-refresh mr-1"></i> 新游戏
        </button>
    </header>

    <!-- 游戏主体 -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-8">
        <!-- 游戏说明 -->
        <div class="mb-6 text-center max-w-md">
            <p class="text-gray-400">猜一个5字母的单词，每次猜测后，字母会根据是否正确变色。</p>
            <div class="flex justify-center mt-2 gap-2">
                <span class="w-6 h-6 bg-correct inline-block rounded-sm"></span>
                <span class="text-gray-400">= 字母正确且位置正确</span>
            </div>
            <div class="flex justify-center mt-1 gap-2">
                <span class="w-6 h-6 bg-present inline-block rounded-sm"></span>
                <span class="text-gray-400">= 字母正确但位置错误</span>
            </div>
            <div class="flex justify-center mt-1 gap-2">
                <span class="w-6 h-6 bg-absent inline-block rounded-sm"></span>
                <span class="text-gray-400">= 字母错误</span>
            </div>
        </div>

        <!-- 游戏棋盘 -->
        <div id="gameBoard" class="grid grid-cols-5 gap-2 mb-8 max-w-[300px] w-full">
            <!-- JavaScript will populate the tiles -->
        </div>

        <!-- 键盘 -->
        <div id="keyboard" class="max-w-[500px] w-full flex flex-col gap-2 mt-4">
            <div class="flex justify-center gap-1">
                <!-- JavaScript will populate the keys -->
            </div>
            <div class="flex justify-center gap-1">
                <!-- JavaScript will populate the keys -->
            </div>
            <div class="flex justify-center gap-1">
                <!-- JavaScript will populate the keys -->
            </div>
        </div>

        <!-- 消息提示 -->
        <div id="message" class="mt-6 text-center h-6"></div>
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-gray-700 py-4 px-4 text-center text-gray-500 text-sm">
        <p>© 2023 Endless Wordle - 你可以在一天内无限次游玩</p>
    </footer>

    <!-- 游戏结束弹窗 -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-xl p-8 max-w-md w-full mx-4 transform transition-all duration-300 scale-95 opacity-0" id="modalContent">
            <h2 class="text-2xl font-bold mb-4" id="modalTitle">游戏结束</h2>
            <p class="text-gray-300 mb-6" id="modalMessage">恭喜你，猜对了！</p>
            <div class="flex justify-center gap-4">
                <button id="closeModalBtn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-6 rounded transition-all duration-300">
                    关闭
                </button>
                <button id="playAgainBtn" class="bg-primary hover:bg-primary/90 text-white py-2 px-6 rounded transition-all duration-300">
                    再玩一次
                </button>
            </div>
        </div>
    </div>

    <script>
        // 单词库 - 只包含5个字母的单词
        const wordList = [
            "apple", "table", "chair", "mouse", "water", "light", "music", "plant", "train", "phone",
            "green", "black", "white", "house", "money", "earth", "beach", "cloud", "dream", "fight"
        ];

        // 游戏状态
        let currentWord = "";
        let currentGuess = 0;
        let currentLetter = 0;
        let gameOver = false;
        let tiles = [];
        let keys = [];

        // DOM元素
        const gameBoard = document.getElementById('gameBoard');
        const keyboard = document.getElementById('keyboard');
        const message = document.getElementById('message');
        const gameOverModal = document.getElementById('gameOverModal');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const newGameBtn = document.getElementById('newGameBtn');

        // 初始化游戏
        function initGame() {
            // 重置游戏状态
            currentGuess = 0;
            currentLetter = 0;
            gameOver = false;
            
            // 清空游戏板和键盘
            gameBoard.innerHTML = '';
            keyboard.innerHTML = '';
            
            // 选择一个随机单词
            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            console.log("答案:", currentWord); // 仅用于调试
            
            // 创建游戏板
            createGameBoard();
            
            // 创建键盘
            createKeyboard();
            
            // 重置消息
            message.textContent = '';
            
            // 隐藏弹窗
            gameOverModal.classList.add('hidden');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
        }

        // 创建游戏板
        function createGameBoard() {
            tiles = [];
            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement('div');
                    tile.classList.add(
                        'w-14', 'h-14', 'border-2', 'border-gray-700', 'rounded-md', 
                        'flex', 'items-center', 'justify-center', 'text-2xl', 'font-bold',
                        'transition-all', 'duration-300'
                    );
                    gameBoard.appendChild(tile);
                    tiles.push(tile);
                }
            }
        }

        // 创建键盘
        function createKeyboard() {
            const rows = [
                ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
                ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
                ['enter', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'backspace']
            ];
            
            keys = [];
